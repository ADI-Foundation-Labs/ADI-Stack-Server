name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel in-progress runs for the same PR / ref (PRs only).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debug info makes the test archive large enough that downloading it dominates the IT job;
  # line tables keep file:line in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build server
        run: cargo build --bin zksync-os-server

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      ZKSYNC_USE_CUDA_STUBS: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: >
          cargo clippy --all-targets --all-features --workspace
          --exclude zksync_os_integration_tests -- -D warnings

  build-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build and archive tests
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

      # Same --workspace selection as the archive, so nothing is recompiled.
      - name: Run unit tests
        run: cargo nextest run --workspace -E 'not package(zksync_os_integration_tests)'

  integration-tests:
    name: Integration tests
    # Prover-input-heavy tests time out on standard runners.
    runs-on: server-runner-linux-x64-8c-32r
    needs: build-tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive

      # build.rs doesn't run for archived tests.
      - name: Decompress L1 states
        run: for f in local-chains/*/l1-state.json.gz; do gunzip -kf "$f"; done

      - name: Run integration tests
        run: >
          cargo-nextest nextest run --archive-file nextest-archive.tar.zst
          -E 'package(zksync_os_integration_tests)' --profile ci

  # Single required status check for branch protection.
  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs: [build, fmt, clippy, build-tests, integration-tests]
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(join(needs.*.result, ','), 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
