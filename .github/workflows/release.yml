# Dry run for now. To switch releases on, in one PR:
#   1. uncomment the lines under the "release:" markers below;
#   2. give one of its commits the footer `Release-As: 1.0.0`. Merging the PR then
#      releases v1.0.0; until a v1.0.0 exists, nothing is released.
name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

env:
  DAGGER_VERSION: "0.19.11"
  # feat/upstream-aware-planner (dagger-modules MR !21); switch to its release tag once merged.
  MODULE: gitlab.sre.ideasoft.io/adi-foundation/adi-chain/tools/dagger-modules.git/release@67959dbd282b270da14bd19836b5e73de8f45ee5
  RELEASE_ARGS: --tag-only --lowest-version=1.0.0

jobs:
  preview:
    name: Release preview
    # Fork PRs get no secrets, so they cannot load the release tooling.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Plan
        env:
          DM_USER: ${{ vars.DAGGER_MODULES_GITLAB_USER }}
          DM_TOKEN: ${{ secrets.DAGGER_MODULES_GITLAB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Dagger asks this helper for GitLab credentials; the token stays in the step's env, never on disk.
          # shellcheck disable=SC2016
          git config --global credential.https://gitlab.sre.ideasoft.io.helper \
            '!f() { test "$1" = get && printf "username=%s\npassword=%s\n" "$DM_USER" "$DM_TOKEN"; }; f'
          # shellcheck disable=SC2086
          dagger call -q -m "$MODULE" prepare-release --source=. $RELEASE_ARGS \
            --dry-run --pr-title="$PR_TITLE" > result.json
          jq -r .summary result.json | tee -a "$GITHUB_STEP_SUMMARY" > comment.md

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: release-preview
          path: comment.md

  release:
    name: Release
    if: github.event_name != 'pull_request' && github.repository == 'ADI-Foundation-Labs/ADI-Stack-Server'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      # The App must be allowed by the v* tag ruleset. A tag pushed with GITHUB_TOKEN
      # starts no workflows, so docker.yml would never build it.
      # release:
      # - name: Release token
      #   id: app
      #   uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      #   with:
      #     app-id: ${{ vars.RELEASE_APP_ID }}
      #     private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release
        env:
          DM_USER: ${{ vars.DAGGER_MODULES_GITLAB_USER }}
          DM_TOKEN: ${{ secrets.DAGGER_MODULES_GITLAB_TOKEN }}
          # release:
          # GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Dagger asks this helper for GitLab credentials; the token stays in the step's env, never on disk.
          # shellcheck disable=SC2016
          git config --global credential.https://gitlab.sre.ideasoft.io.helper \
            '!f() { test "$1" = get && printf "username=%s\npassword=%s\n" "$DM_USER" "$DM_TOKEN"; }; f'
          flags=(--dry-run)
          # release:
          # flags=(--git-token=env:GH_TOKEN --forge-token=env:GH_TOKEN)
          # shellcheck disable=SC2086
          dagger call -q -m "$MODULE" prepare-release --source=. $RELEASE_ARGS \
            --forge-release "${flags[@]}" > result.json
          jq -r .summary result.json | tee -a "$GITHUB_STEP_SUMMARY"
