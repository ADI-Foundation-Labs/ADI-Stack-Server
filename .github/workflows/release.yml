# Each push to main releases the next version from the conventional commits since
# the last release: a v1.x.y tag (which docker.yml builds) and its GitHub Release.
# Nothing is committed to main.
#
# Dry run for now. To switch releases on, in one PR:
#   1. uncomment the lines under the "release:" markers below;
#   2. give one of its commits the footer `Release-As: 1.0.0`. Merging the PR then
#      releases v1.0.0; until a v1.0.0 exists, nothing is released.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  DAGGER_VERSION: "0.19.11"
  # feat/upstream-aware-planner (dagger-modules MR !21); switch to its release tag once merged.
  DAGGER_MODULES_REF: 4dc08c3ca433968eb927a60e5d8e91430f909a32

jobs:
  release:
    name: Release
    # Forks have no access to the release tooling.
    if: github.repository == 'ADI-Foundation-Labs/ADI-Stack-Server'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up dagger-modules
        id: dm
        uses: ./.github/actions/setup-dagger-modules
        with:
          gitlab-user: ${{ vars.DAGGER_MODULES_GITLAB_USER }}
          gitlab-token: ${{ secrets.DAGGER_MODULES_GITLAB_TOKEN }}
          ref: ${{ env.DAGGER_MODULES_REF }}
          dagger-version: ${{ env.DAGGER_VERSION }}

      # The App must be allowed by the v* tag ruleset. A tag pushed with GITHUB_TOKEN
      # starts no workflows, so docker.yml would never build it.
      # release:
      # - name: Release token
      #   id: app
      #   uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      #   with:
      #     app-id: ${{ vars.RELEASE_APP_ID }}
      #     private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release
        env:
          MODULE: ${{ steps.dm.outputs.path }}/release
          # release:
          # GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          flags=(--dry-run)
          # release:
          # flags=(--git-token=env:GH_TOKEN --forge-token=env:GH_TOKEN)
          dagger call -q -m "$MODULE" prepare-release --source=. \
            --tag-only --lowest-version=1.0.0 --forge-release "${flags[@]}" > result.json
          jq -r .summary result.json | tee -a "$GITHUB_STEP_SUMMARY"
