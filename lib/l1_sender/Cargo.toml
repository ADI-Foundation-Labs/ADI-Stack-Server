[package]
name = "zksync_os_l1_sender"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zksync_os_contract_interface.workspace = true
zksync_os_mini_merkle_tree.workspace = true
zksync_os_observability.workspace = true
zksync_os_merkle_tree.workspace = true
zksync_os_pipeline.workspace = true
zksync_os_types.workspace = true
zksync_os_batch_types.workspace = true

zksync_os_interface.workspace = true
zk_ee.workspace = true
zk_os_basic_system.workspace = true

zk_os_basic_system_0_1_0.workspace = true
zk_ee_0_1_0.workspace = true

alloy = { workspace = true, default-features = false, features = [
    "reqwest",
    "kzg",
    "provider-debug-api",
    "signer-local",
] }
anyhow.workspace = true
async-trait.workspace = true
blake2.workspace = true
futures.workspace = true
ruint.workspace = true
serde.workspace = true
secrecy.workspace = true
# `time` is needed for the `tokio::time::timeout` send-phase bound in `run_l1_sender`.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
time = { workspace = true, features = ["parsing", "formatting"] }
itertools.workspace = true
vise.workspace = true

[dev-dependencies]
serde_json.workspace = true
# `zksync_os_types` only compiles with its `reth` feature on (it references
# `reth_primitives_traits` unconditionally). In a `--workspace` build this is
# enabled via feature unification; enable it here so `-p zksync_os_l1_sender`
# tests build standalone too.
zksync_os_types = { workspace = true, features = ["reth"] }
# Needed to build a custom hanging `Transport` for the freeze-reproduction test.
tower.workspace = true
alloy = { workspace = true, default-features = false, features = ["json-rpc"] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    # `test-util` enables the paused virtual clock used by the "red" timeout test.
    "test-util",
] }
